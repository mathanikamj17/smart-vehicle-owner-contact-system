<!DOCTYPE html>
<html>
<head>
    <title>Smart Vehicle Contact System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Smart Vehicle Owner Contact System</h1>
<section id="register">
    <h2>🚗 Vehicle Registration</h2>

    <div class="step-progress">
        <p id="stepText">Step 1 of 5</p>
    </div>

    <form id="vehicleForm">

        <!-- STEP 1 -->
        <div class="form-step active">
            <h3>Step 1 - Owner Details</h3>

            <input type="text" id="ownerName"
                placeholder="Owner Name" required>

            <input type="email" id="ownerEmail"
                placeholder="Email Address" required>

            <input type="tel" id="ownerPhone"
                placeholder="Phone Number" required>
        </div>

        <!-- STEP 2 -->
        <div class="form-step">
            <h3>Step 2 - Vehicle Details</h3>

            <input type="text" id="regNumber"
                placeholder="Vehicle Registration Number" required>

            <select id="vehicleType" required>
                <option value="">Select Vehicle Type</option>
                <option>Car</option>
                <option>Bike</option>
                <option>Truck</option>
                <option>Other</option>
            </select>

            <input type="text" id="vehicleModel"
                placeholder="Vehicle Model" required>
        </div>

        <!-- STEP 3 -->
        <div class="form-step">
            <h3>Step 3 - Additional Details</h3>

            <input type="text" id="city"
                placeholder="City" required>

            <input type="text" id="address"
                placeholder="Address" required>
        </div>

        <!-- STEP 4 -->
        <div class="form-step">
            <h3>Step 4 - Review Details</h3>
            <div id="reviewDetails"></div>
            <p>Please check your details before submitting.</p>
        </div>

        <!-- STEP 5 -->
        <div class="form-step">
            <h3>Step 5 - Registration Complete</h3>
            <p>Confirm your vehicle registration.</p>
            <button type="submit">Confirm Registration</button>
        </div>

        <div class="form-buttons">
            <button type="button" id="prevBtn"
                onclick="changeStep(-1)" disabled>
                Back
            </button>

            <button type="button" id="nextBtn"
                onclick="changeStep(1)">
                Next
            </button>
        </div>

        <p id="registerResult"></p>

    </form>
</section> 
</body>
</html>
